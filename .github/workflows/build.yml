# Builds the packaged app on the machines it runs on: QueenBee.exe on Windows, QueenBee.app on macOS. Runs on every
# version tag (v0.1.1) and by hand. Each bundle is started headless and asked /api/ping, so a bundle that cannot start
# never reaches a release. On a tag the jobs create the GitHub release of that tag if it is missing and attach the files.
#
# Signing: when the repository has the secrets WINDOWS_CERT_PFX (a code-signing certificate, base64 of the .pfx) and
# WINDOWS_CERT_PASSWORD, the Windows job signs QueenBee.exe and the installer with SignTool and a timestamp; without them
# the bundles are unsigned and Windows shows SmartScreen ("More info", "Run anyway"). macOS Gatekeeper refuses an
# unnotarized app on first open (right-click, Open; on newer macOS also System Settings, Privacy & Security, "Open
# Anyway"); notarizing needs an Apple developer account.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # to attach the bundles to the release of the tag
  id-token: write          # with attestations: GitHub's signed record that these files were built here, from this commit
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File scripts\build-exe.ps1
      - name: Smoke test (headless)
        shell: pwsh
        env:
          QUEENBEE_STATE_DIR: ${{ runner.temp }}\queenbee-state
        run: |
          $p = Start-Process -FilePath dist\QueenBee\QueenBee.exe -ArgumentList '--port','7895','--host-port','7892','--no-window' -PassThru
          $ok = $false
          foreach ($i in 1..60) { try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7895/api/ping -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}; Start-Sleep 2 }
          Get-Content "$env:QUEENBEE_STATE_DIR\mother.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          & dist\QueenBee\QueenBee.exe --stop-all
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the exe did not answer /api/ping" }
      - name: Smoke test (window, files marked as downloaded)
        shell: pwsh
        env:
          QUEENBEE_STATE_DIR: ${{ runner.temp }}\queenbee-state-window
        run: |
          # A browser download extracted by Explorer marks every file as from the internet, and .NET will not load a
          # marked DLL: v0.1.1's window never opened that way while every headless test passed. Test it as people get it.
          Copy-Item -Recurse dist\QueenBee "$env:RUNNER_TEMP\marked"
          Get-ChildItem "$env:RUNNER_TEMP\marked" -Recurse -File | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          $exe = "$env:RUNNER_TEMP\marked\QueenBee.exe"
          # The person clicks past the warning for the exe itself (SmartScreen, "Run anyway"); a runner has nobody to click,
          # so the exe alone is unmarked here. Every DLL in _internal stays marked, which is what broke the window.
          Remove-Item -Path $exe -Stream Zone.Identifier
          $p = Start-Process -FilePath $exe -ArgumentList '--port','7897','--host-port','7894' -PassThru
          Start-Sleep 25
          $p.Refresh()
          $alive = -not $p.HasExited
          Get-Content "$env:QUEENBEE_STATE_DIR\mother.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          & $exe --stop-all
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $alive) { throw "the window did not stay open (exit code $($p.ExitCode))" }
      - name: Version
        id: ver
        shell: pwsh
        run: '"v=$(python -c ""import queenbee; print(queenbee.__version__)"")" >> $env:GITHUB_OUTPUT'
      - name: Sign the exe (only when a certificate is given)
        if: env.PFX != ''
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\QueenBee\QueenBee.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: Zip
        shell: pwsh
        run: |
          $note = "EXTRACT THIS ZIP BEFORE RUNNING.`r`n`r`nRight-click the zip, Extract All, pick a folder, then start QueenBee.exe from that folder.`r`nStarted from inside the zip, QueenBee.exe cannot find the _internal folder next to it and shows 'Failed to load Python DLL'.`r`n`r`nEasier: the installer, QueenBee-${{ steps.ver.outputs.v }}-setup.exe, from the same release page.`r`n"
          Set-Content -Path "dist\QueenBee\READ ME FIRST - extract before running.txt" -Value $note -Encoding ASCII
          Compress-Archive -Path dist\QueenBee -DestinationPath "dist\QueenBee-${{ steps.ver.outputs.v }}-win64.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { choco install innosetup --no-progress -y | Out-Null; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=${{ steps.ver.outputs.v }}" scripts\installer.iss
          Get-ChildItem dist\QueenBee-*-setup.exe
      - name: Sign the installer (only when a certificate is given)
        if: env.PFX != ''
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 (Get-ChildItem dist\QueenBee-*-setup.exe).FullName
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: Installer smoke test (silent install, start, stop, uninstall)
        shell: pwsh
        env:
          QUEENBEE_STATE_DIR: ${{ runner.temp }}\queenbee-state2
        run: |
          $setup = (Get-ChildItem dist\QueenBee-*-setup.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\QueenBee\QueenBee.exe"
          if (-not (Test-Path $exe)) { throw "the installer did not put QueenBee.exe where it says" }
          $p = Start-Process -FilePath $exe -ArgumentList '--port','7896','--host-port','7893','--no-window' -PassThru
          $ok = $false
          foreach ($i in 1..60) { try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7896/api/ping -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}; Start-Sleep 2 }
          & $exe --stop-all
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $unins = (Get-ChildItem "$env:LOCALAPPDATA\Programs\QueenBee\unins*.exe" | Select-Object -First 1).FullName
          Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not $ok) { throw "the installed exe did not answer /api/ping" }
      - name: Attest where the files were built (public repository only; private ones need a paid plan)
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/QueenBee-*-win64.zip
            dist/QueenBee-*-setup.exe
            dist/QueenBee/QueenBee.exe
      - uses: actions/upload-artifact@v4
        with:
          name: QueenBee-windows
          path: |
            dist/QueenBee-*-win64.zip
            dist/QueenBee-*-setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null; if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "QueenBee ${{ steps.ver.outputs.v }}" --notes-file CHANGELOG.md 2>$null }
          $files = Get-ChildItem dist\QueenBee-*-setup.exe, dist\QueenBee-*-win64.zip
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Path dist\SHA256SUMS-windows.txt -Encoding ASCII
          gh release upload "${{ github.ref_name }}" ($files | ForEach-Object FullName) dist\SHA256SUMS-windows.txt --clobber

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: bash scripts/build-mac.sh
      - name: Smoke test (headless)
        env:
          QUEENBEE_STATE_DIR: ${{ runner.temp }}/queenbee-state
        run: |
          dist/QueenBee.app/Contents/MacOS/QueenBee --port 7895 --host-port 7892 --no-window &
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7895/api/ping >/dev/null; then ok=1; break; fi
            sleep 2
          done
          tail -n 20 "$QUEENBEE_STATE_DIR/mother.log" || true
          dist/QueenBee.app/Contents/MacOS/QueenBee --stop-all || true
          kill %1 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "the app did not answer /api/ping"; exit 1; }
      - name: Zip
        run: |
          v=$(python -c "import queenbee; print(queenbee.__version__)")
          ditto -c -k --keepParent dist/QueenBee.app "dist/QueenBee-$v-macos.zip"
      - name: Attest where the file was built (public repository only)
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/QueenBee-*-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QueenBee-macos
          path: dist/QueenBee-*-macos.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "QueenBee $(python -c 'import queenbee; print(queenbee.__version__)')" --notes-file CHANGELOG.md || true
          cd dist
          shasum -a 256 QueenBee-*-macos.zip > SHA256SUMS-macos.txt
          gh release upload "${{ github.ref_name }}" QueenBee-*-macos.zip SHA256SUMS-macos.txt --clobber

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: bash scripts/build-linux.sh
      - name: Smoke test (headless)
        env:
          QUEENBEE_STATE_DIR: ${{ runner.temp }}/queenbee-state
        run: |
          dist/QueenBee/QueenBee --port 7895 --host-port 7892 --no-window &
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7895/api/ping >/dev/null; then ok=1; break; fi
            sleep 2
          done
          tail -n 20 "$QUEENBEE_STATE_DIR/mother.log" || true
          dist/QueenBee/QueenBee --stop-all || true
          kill %1 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "the app did not answer /api/ping"; exit 1; }
      - name: Tarball
        run: |
          v=$(python -c "import queenbee; print(queenbee.__version__)")
          tar -C dist -czf "dist/QueenBee-$v-linux-x86_64.tar.gz" QueenBee
      - name: Attest where the file was built (public repository only)
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/QueenBee-*-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: QueenBee-linux
          path: dist/QueenBee-*-linux-x86_64.tar.gz
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "QueenBee $(python -c 'import queenbee; print(queenbee.__version__)')" --notes-file CHANGELOG.md || true
          cd dist
          sha256sum QueenBee-*-linux-x86_64.tar.gz > SHA256SUMS-linux.txt
          gh release upload "${{ github.ref_name }}" QueenBee-*-linux-x86_64.tar.gz SHA256SUMS-linux.txt --clobber
